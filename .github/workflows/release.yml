name: release

# The OpenPak build of Ryujinx. A vX.Y.Z tag publishes the four desktop targets
# (Linux x64 and arm64, Windows x64, macOS universal) on a GitHub Release, each build attaching
# its own files; a manual dispatch builds workflow artifacts alone. Plain pushes to
# master do not build: the single self-hosted runner would spend most of an hour on every
# commit and block every other repo's deploy behind it. Upstream's Forgejo workflows stay
# untouched in .forgejo/ for merging; this one is ours.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # The release is made first and every build attaches its own files to it: artifacts no longer
  # carry the builds to a release job, because the organisation's artifact quota filled up and
  # stopped every release (2026-09-23).
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, podman, heavy]
    steps:
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Ryujinx (OpenPak) $GITHUB_REF_NAME"
          --notes "Upstream Ryujinx with the OpenPak network layer. Set OPENPAK_SERVER and drop the CA in the data directory; see OPENPAK.md."
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"

  build:
    name: ${{ matrix.rid }}
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: [self-hosted, linux, podman, heavy]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One at a time: the self-hosted runner is the owner's workstation (2026-09-23).
      max-parallel: 1
      matrix:
        rid: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      # A half-written SDK in the tool cache (the disk filled up on 2026-09-23) is reused by
      # setup-dotnet as it is and fails at startup; one that cannot run is installed again.
      - name: Drop a broken cached .NET SDK
        run: |
          d="${{ runner.tool_cache }}/dotnet"
          if [ -x "$d/dotnet" ] && ! "$d/dotnet" --info >/dev/null 2>&1; then
            echo "::warning::The cached .NET SDK in $d does not start; reinstalling it."
            rm -rf "$d"
          fi
      - uses: actions/setup-dotnet@v4
        # The self-hosted runner is not root: the default /usr/share/dotnet is not writable. The
        # tool cache persists between runs, so the SDK is installed once.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - id: v
        run: |
          case "$GITHUB_REF" in refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;; *) echo "version=0.0.0" >> "$GITHUB_OUTPUT" ;; esac
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: OpenPak compatibility list
        # From the website's catalogue; an unreachable API or a title without an id fails the build.
        run: python3 scripts/update-openpak-compatibility.py
      - name: Publish
        run: >
          nice -n 10 dotnet publish src/Ryujinx -c Release -r ${{ matrix.rid }} --self-contained -o publish -maxcpucount:4
          -p:Version=${{ steps.v.outputs.version }} -p:SourceRevisionId=${{ steps.v.outputs.sha }}
          -p:DebugType=embedded -p:ExtraDefineConstants=DISABLE_UPDATER
      - name: Pack
        run: |
          set -e
          name="ryujinx-openpak-${{ steps.v.outputs.version }}-${{ matrix.rid }}"
          rm -f publish/*.pdb
          case "${{ matrix.rid }}" in
            win-*) (cd publish && zip -qr "../$name.zip" .) ;;
            *)     chmod +x publish/Ryujinx* 2>/dev/null || true; tar -C publish -czf "$name.tar.gz" . ;;
          esac
          ls -l "$name".*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ryujinx-openpak-* --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: ryujinx-openpak-${{ matrix.rid }}
          path: ryujinx-openpak-*
          if-no-files-found: error
          retention-days: 3
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"

  macos:
    # After the Linux/Windows builds, never beside them.
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    # Upstream's own recipe: the universal .app is assembled on Linux with LLVM's lipo and
    # rcodesign, which costs a tenth of a macOS runner minute and needs no Apple identity
    # (the bundle is ad-hoc signed, as upstream's is).
    name: macos-universal
    runs-on: [self-hosted, linux, podman, heavy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      # A half-written SDK in the tool cache (the disk filled up on 2026-09-23) is reused by
      # setup-dotnet as it is and fails at startup; one that cannot run is installed again.
      - name: Drop a broken cached .NET SDK
        run: |
          d="${{ runner.tool_cache }}/dotnet"
          if [ -x "$d/dotnet" ] && ! "$d/dotnet" --info >/dev/null 2>&1; then
            echo "::warning::The cached .NET SDK in $d does not start; reinstalling it."
            rm -rf "$d"
          fi
      - uses: actions/setup-dotnet@v4
        # The self-hosted runner is not root: the default /usr/share/dotnet is not writable. The
        # tool cache persists between runs, so the SDK is installed once.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: LLVM lipo and rcodesign
        run: |
          set -e
          command -v llvm-lipo >/dev/null
          gh release download -R indygreg/apple-platform-rs --pattern 'apple-codesign-*-x86_64-unknown-linux-musl.tar.gz' -O rcodesign.tar.gz
          tar -xzf rcodesign.tar.gz --wildcards --strip-components=1 '*/rcodesign'
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 rcodesign "$RUNNER_TEMP/bin/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rcodesign" --version
        env:
          GH_TOKEN: ${{ github.token }}
      - id: v
        run: |
          case "$GITHUB_REF" in refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;; *) echo "version=0.0.0" >> "$GITHUB_OUTPUT" ;; esac
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: OpenPak compatibility list
        # From the website's catalogue; an unreachable API or a title without an id fails the build.
        run: python3 scripts/update-openpak-compatibility.py
      - name: Publish and bundle
        run: >
          nice -n 10 taskset -c 0-7 bash distribution/macos/create_macos_pr_build_ava.sh . publish_tmp publish ./distribution/macos/entitlements.xml
          "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.sha }}" Release "-p:ExtraDefineConstants=DISABLE_UPDATER"
      - name: Name it like the others
        run: |
          set -e
          f=$(ls publish/*.tar.gz | head -1)
          mv "$f" "ryujinx-openpak-${{ steps.v.outputs.version }}-macos-universal.app.tar.gz"
          ls -l ryujinx-openpak-*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ryujinx-openpak-* --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: ryujinx-openpak-macos-universal
          path: ryujinx-openpak-*
          if-no-files-found: error
          retention-days: 3
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"
